<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孟村八极两仪桩姿态矫正</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
#video{display:none;}
#canvas{max-width:100%;height:auto;}
#tip{font-size:18px;padding:12px;color:#ff4444;text-align:center;min-height:60px;line-height:1.5;}
#btnSwitch{margin:10px;padding:8px 16px;font-size:16px;}
</style>
</head>
<body>
<div id="tip">等待摄像头加载...</div>
<button id="btnSwitch">切换前/后置摄像头</button>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('video');
const tipBox = document.getElementById('tip');
const btnSwitch = document.getElementById('btnSwitch');

let stream = null;
let useRearCam = true; // 默认后置摄像头
let lastSpeakTime = 0;
const speakInterval = 2500; //语音防刷屏

// 初始化姿态模型
const pose = new Pose({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});
pose.setOptions({
  modelComplexity:1,
  smoothLandmarks:true,
  enableSegmentation:false,
  smoothSegmentation:false
});
pose.onResults(onResults);

// 启动摄像头
async function startCamera(rearMode){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
  const constraints = {
    video:{ facingMode: rearMode ? "environment" : "user" }
  };
  stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  tipBox.innerText="摄像头就绪，请站入画面，全身入镜";
  sendFrame();
}

// 循环送入画面给模型
async function sendFrame(){
  await pose.send({image:video});
  requestAnimationFrame(sendFrame);
}

// 姿态结果处理
function onResults(results){
  ctx.save();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(results.image,0,0,canvas.width,canvas.height);

  if(results.poseLandmarks){
    // 只保留躯干下肢关键点，忽略人脸
    const landmarks = results.poseLandmarks;
    const leftHip = landmarks[23];
    const rightHip = landmarks[24];
    const leftKnee = landmarks[25];
    const rightKnee = landmarks[26];
    const leftAnkle = landmarks[27];
    const rightAnkle = landmarks[28];
    const leftShoulder = landmarks[11];
    const rightShoulder = landmarks[12];

    // 绘制骨架（不画人脸）
    drawConnectors(ctx, landmarks, POSE_CONNECTIONS, {color:'#00ff00',lineWidth:2});
    drawLandmarks(ctx, [leftHip,rightHip,leftKnee,rightKnee,leftAnkle,rightAnkle,leftShoulder,rightShoulder],{color:'#ff0000',lineWidth:1});

    let warnText = "";
    const now = Date.now();

    // 1.膝盖内扣判断：膝盖X坐标超过脚踝
    if(leftKnee.x > leftAnkle.x + 0.04) warnText += "左膝内扣！";
    if(rightKnee.x < rightAnkle.x - 0.04) warnText += "右膝内扣！";

    // 2.足弓塌陷：脚踝过度下压，y偏移过大
    if(leftAnkle.y > leftKnee.y + 0.22) warnText += "左脚足弓塌陷！";
    if(rightAnkle.y > rightKnee.y + 0.22) warnText += "右脚足弓塌陷！";

    //3.胯不平
    const hipDiff = Math.abs(leftHip.y - rightHip.y);
    if(hipDiff>0.05) warnText += "胯高低不平！";

    //4.含胸：肩膀过于前探
    const shoulderForward = (leftShoulder.x + rightShoulder.x)/2 - (leftHip.x + rightHip.x)/2;
    if(shoulderForward < -0.07) warnText += "含胸，注意拔背！";

    if(warnText){
      tipBox.innerText = warnText;
      if(now - lastSpeakTime > speakInterval){
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(warnText);
        window.speechSynthesis.speak(utter);
        lastSpeakTime = now;
      }
    }else{
      tipBox.innerText="姿势合格，保持两仪桩";
    }
  }else{
    tipBox.innerText="未识别到全身，请后退，完整全身入镜";
  }
  ctx.restore();
}

//切换摄像头按钮
btnSwitch.onclick = async ()=>{
  useRearCam = !useRearCam;
  await startCamera(useRearCam);
}

//页面加载完成启动后置
startCamera(useRearCam).catch(err=>{
  tipBox.innerText="摄像头权限被拒绝，请在浏览器设置允许摄像头";
  console.error(err);
});
</script>
</body>
</html>
