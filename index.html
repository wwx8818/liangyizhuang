<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孟村八极两仪桩姿态矫正（重点监测胯）</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
#video{display:none;}
#canvas{max-width:100%;height:auto;}
#tip{font-size:28px;padding:12px;color:#ff4444;text-align:center;min-height:90px;line-height:1.4;font-weight:bold;}
#info{font-size:24px;color:#8cf;padding:6px;font-weight:bold;}
#btnSwitch{margin:10px;padding:12px 20px;font-size:20px;}
</style>
</head>
<body>
<div id="tip">等待摄像头加载...</div>
<div id="info">胯差值：--</div>
<button id="btnSwitch">切换前/后置摄像头</button>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('video');
const tipBox = document.getElementById('tip');
const infoBox = document.getElementById('info');
const btnSwitch = document.getElementById('btnSwitch');

let stream = null;
let useRearCam = true;
let lastSpeakTime = 0;
const speakInterval = 2800;

const pose = new Pose({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});
pose.setOptions({
  modelComplexity:1,
  smoothLandmarks:true,
  enableSegmentation:false,
  smoothSegmentation:false
});
pose.onResults(onResults);

function stopCameraStream(){
  if(stream){
    stream.getTracks().forEach(track => {
      track.stop();
    });
    stream = null;
  }
  video.srcObject = null;
}

async function startCamera(rearMode){
  stopCameraStream();
  try{
    const constraints = {
      video:{ facingMode: rearMode ? "environment" : "user" }
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    tipBox.innerText="摄像头就绪，正对镜头，重点观察胯部标记点";
    sendFrame();
  }catch(err){
    tipBox.innerText="摄像头打开失败，请刷新页面，检查权限";
    console.error(err);
  }
}

async function sendFrame(){
  if(!stream) return;
  await pose.send({image:video});
  requestAnimationFrame(sendFrame);
}

//向量夹角计算
function getAngle(p1,p2,p3){
  const v1x = p1.x - p2.x;
  const v1y = p1.y - p2.y;
  const v2x = p3.x - p2.x;
  const v2y = p3.y - p2.y;
  const dot = v1x*v2x + v1y*v2y;
  const mag1 = Math.sqrt(v1x*v1x + v1y*v1y);
  const mag2 = Math.sqrt(v2x*v2x + v2y*v2y);
  const cosA = Math.max(-1,Math.min(1,dot/(mag1*mag2)));
  return Math.acos(cosA)*180/Math.PI;
}

function onResults(results){
  ctx.save();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(results.image,0,0,canvas.width,canvas.height);

  if(results.poseLandmarks){
    const lm = results.poseLandmarks;
    const lHip = lm[23], rHip = lm[24];
    const lKnee = lm[25], rKnee = lm[26];
    const lAnkle = lm[27], rAnkle = lm[28];
    const lShoulder = lm[11], rShoulder = lm[12];

    // 绘制骨架
    drawConnectors(ctx, lm, POSE_CONNECTIONS, {color:'#00ff00',lineWidth:2});
    // 胯点超大红色圆点突出
    drawLandmarks(ctx, [lHip,rHip],{color:'#ff2222',lineWidth:4,radius:8});
    drawLandmarks(ctx, [lKnee,rKnee,lAnkle,rAnkle,lShoulder,rShoulder],{color:'#ffaa00',lineWidth:1,radius:4});

    let warnText = "";
    const now = Date.now();

    // ========== 胯部判断优先 ==========
    const hipDiff = Math.abs(lHip.y - rHip.y);
    infoBox.innerText = `胯高度差值：${hipDiff.toFixed(3)}`;
    // 胯不平
    if(hipDiff>0.05){
      warnText += "胯高低不平！";
    }
    // 臀部后撅，尾闾不正
    const hipCenterX = (lHip.x + rHip.x)/2;
    const shoulderCenterX = (lShoulder.x + rShoulder.x)/2;
    if(hipCenterX > shoulderCenterX + 0.07){
      warnText += "臀部后撅，尾闾中正！";
    }

    // ========== 其余判断放后面 ==========
    //膝盖内扣
    if(lKnee.x > lAnkle.x + 0.06) warnText += "左膝内扣！";
    if(rKnee.x < rAnkle.x - 0.06) warnText += "右膝内扣！";
    //足弓塌陷
    const leftCalfAngle = getAngle(lHip,lKnee,lAnkle);
    const rightCalfAngle = getAngle(rHip,rKnee,rAnkle);
    if(leftCalfAngle < 100) warnText += "左脚足弓塌陷！";
    if(rightCalfAngle < 100) warnText += "右脚足弓塌陷！";
    //含胸拔背
    const shoulderForward = (lShoulder.x + rShoulder.x)/2 - (lHip.x + rHip.x)/2;
    if(shoulderForward < -0.08) warnText += "含胸，注意拔背！";
    //桩架过低
    const hipHeight = (lHip.y + rHip.y)/2;
    const ankleHeight = (lAnkle.y + rAnkle.y)/2;
    if(hipHeight > ankleHeight - 0.05) warnText += "桩架过低，抬高重心！";

    if(warnText){
      tipBox.innerText = warnText;
      if(now - lastSpeakTime > speakInterval){
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(warnText);
        window.speechSynthesis.speak(utter);
        lastSpeakTime = now;
      }
    }else{
      tipBox.innerText="胯部中正，姿势合格，保持两仪桩";
    }
  }else{
    tipBox.innerText="未识别到全身，请后退一点，全身入镜";
    infoBox.innerText="胯差值：--";
  }
  ctx.restore();
}

btnSwitch.onclick = async ()=>{
  useRearCam = !useRearCam;
  await startCamera(useRearCam);
}

startCamera(useRearCam).catch(err=>{
  tipBox.innerText="摄像头权限被拒绝，请在浏览器设置允许摄像头";
  console.error(err);
});
</script>
</body>
</html>
